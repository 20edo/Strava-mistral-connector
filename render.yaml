services:
  - type: web
    name: strava-mistral-connector
    runtime: node
    plan: free
    region: frankfurt  # EU region, closest to Italy
    buildCommand: npm install && npm run build
    startCommand: npm run start:mcp
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RUN_MCP_SERVER
        value: "1"
      - key: MCP_TOKEN
        generateValue: true   # Render generates a random value; copy it for the Vibe connector
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_ACCESS_TOKEN
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: STRAVA_EXPIRES_AT
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Optional, once Garmin Health API access is approved:
      - key: GARMIN_CONSUMER_KEY
        sync: false
      - key: GARMIN_CONSUMER_SECRET
        sync: false
      - key: GARMIN_USER_ACCESS_TOKEN
        sync: false
      - key: GARMIN_USER_ACCESS_TOKEN_SECRET
        sync: false
